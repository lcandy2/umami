name: Sync upstream

on:
  schedule:
    # Run daily at 04:17 UTC (12:17 Asia/Taipei).
    - cron: '17 4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0

      - name: Fast-forward main from Umami upstream master
        run: |
          git remote add upstream https://github.com/umami-software/umami.git
          git fetch upstream master
          git merge --ff-only upstream/master
          git push origin HEAD:main
